<!DOCTYPE html>
<html id="web-developer-about" lang="en">

<head>
  <meta charset="utf-8">
  <title>WebDev</title>
  <meta name="viewport" content="initial-scale=1.0,width=device-width">
  <link href="/svg/logos/color/logo.svg" rel="icon">
</head>

<!-- The ids are about.js's: it fills every one of them with its message. -->
<body>

<main class="flex min-h-screen items-center justify-center bg-surface-sunken p-4">
  <div class="w-full max-w-xl rounded-xl border border-line bg-surface p-10 text-center shadow-sm">
    <img src="/svg/logos/color/logo.svg" width="88" height="88" alt="" class="mx-auto">
    <h1 id="name" class="mt-5 text-3xl font-semibold tracking-tight"></h1>
    <p id="description" class="mt-2 text-ink-muted"></p>

    <dl class="mt-8 grid grid-cols-1 gap-px overflow-hidden rounded-lg border border-line bg-line text-sm sm:grid-cols-3">
      <div class="bg-surface-raised px-4 py-3">
        <dt id="author" class="text-[0.65rem] font-medium tracking-wide text-ink-muted uppercase"></dt>
        <dd id="author-value" class="mt-1"></dd>
      </div>

      <div class="bg-surface-raised px-4 py-3">
        <dt id="version" class="text-[0.65rem] font-medium tracking-wide text-ink-muted uppercase"></dt>
        <dd id="version-value" class="mt-1 font-mono"></dd>
      </div>

      <div class="bg-surface-raised px-4 py-3">
        <dt id="build-date" class="text-[0.65rem] font-medium tracking-wide text-ink-muted uppercase"></dt>
        <dd id="build-date-value" class="mt-1 font-mono"></dd>
      </div>
    </dl>

    <a id="website" href="#" class="mt-8 inline-flex items-center gap-2 rounded-full bg-accent px-5 py-2 text-sm font-medium text-on-accent no-underline transition-opacity hover:opacity-90"><svg class="size-4 fill-current" aria-hidden="true"><use href="/svg/icons/icons.svg#circle-arrow-right"></use></svg></a>
  </div>
</main>

<script src="/lib/purify.js"></script>
<script type="module" src="./main.ts"></script>

</body>

</html>
