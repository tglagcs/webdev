<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1,shrink-to-fit=no,width=device-width" />
    <!--
      Stays a message placeholder: WXT reads it to build action.default_title,
      the toolbar tooltip, which the browser does localise. It does not
      localise HTML, so main.ts sets document.title at runtime.
    -->
    <title>__MSG_extensionName__</title>
    <link href="/svg/logos/color/logo.svg" rel="icon" />
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
