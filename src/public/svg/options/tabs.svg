<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!--
    The options page tab icons, drawn like the popup menu icons in
    svg/overlay/menus.svg: strokes on a 24x24 grid with no colours of their
    own, so they follow the theme. Resize and Tools are not here, the page
    takes those two from menus.svg so the same tab looks the same in both.

    The same rules as menus.svg hold: stroke settings as attributes on each
    symbol, and no double hyphen in these comments.
  -->

  <!-- General: three sliders. -->
  <symbol
    id="general"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.75"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1" />
    <circle cx="15" cy="7" r="2" />
    <circle cx="9" cy="12" r="2" />
    <circle cx="17" cy="17" r="2" />
  </symbol>
</svg>
