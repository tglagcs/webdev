<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Styles fixture</title>
  <style id="embedded-screen">
    .hidden-by-css { display: none; }
    .invisible { visibility: hidden; }
    .collapsed { visibility: collapse; }
  </style>
  <style id="embedded-print" media="print">
    .print-only { color: rgb(9, 9, 9); }
  </style>
</head>
<body style="margin: 0">

<!-- Inline styles, for toggleInlineStyles / toggleElementInlineStyles. The
     nesting matters: the walk is recursive and has to reach the deep one. -->
<div id="inline-outer" style="color: red">
  <p id="inline-inner" style="color: blue">nested inline style</p>
  <p id="no-inline">no inline style</p>
</div>

<!-- Hidden by CSS, by inline style, and by input type, for
     displayHiddenElements -- which handles all three differently. -->
<div class="hidden-by-css">hidden by a class</div>
<div id="hidden-inline" style="display: none">hidden by an inline style</div>
<span class="invisible">invisible</span>
<span class="collapsed">collapsed</span>
<input type="hidden" name="token" value="abc">
<input type="hidden" name="csrf" value="def">

<!-- A web-developer- element, which both node filters must skip so the
     features never fight each other's markup. -->
<div id="web-developer-something" style="display: none">extension's own</div>

<!-- Frames with and without noresize, for makeFramesResizable. -->
<frame id="frame-locked" noresize></frame>
<frame id="frame-free"></frame>

</body>
</html>
